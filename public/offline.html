<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Offline - Mi Tiendita Cercana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f2f2;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 { margin-bottom: 10px; }
    p { margin-bottom: 20px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Estás sin conexión</h1>
    <p>Parece que no tienes internet en este momento. Algunas funciones pueden no estar disponibles.</p>
    <p>Revisa tu conexión o intenta recargar cuando vuelvas a estar en línea.</p>
    <a href=".">Ir al inicio</a>
  </div>
</body>
</html>
